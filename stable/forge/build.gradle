plugins {
    id 'loader'
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge}"
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }

    implementation("net.xstopho.resourceconfigapi:resourceconfigapi-forge:${minecraft_version}-${resource_config_api}")
    implementation("net.xstopho.resourcelibrary:resourcelibrary-forge:${minecraft_version}-${resource_library}")
}

jar {
    manifest {
        attributes([
                'FMLCorePluginContainsFMLMod': 'true'
        ])
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    reobf = false
    copyIdeResources = true //Calls processResources when in dev

    def directory = project.projectDir.parent.split("\\\\").last()

    def at = file('../common/src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) accessTransformers = [at]

    runs {
        client {
            workingDirectory file("../fabric/runs/client")
            ideaModule "${rootProject.name}.${directory}.${project.name}.main"
            taskName "Client"
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }
        data {
            workingDirectory file('../fabric/runs/client')
            ideaModule "${rootProject.name}.${directory}.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated'), '--existing', file('../common/src/main/resources/').getAbsolutePath()
            taskName 'Data'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modDataRun {
                    source sourceSets.main
                    source project(":stable:common").sourceSets.main
                }
            }
        }
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

publishMods {
    file = jar.archiveFile
    modLoaders.addAll("forge")
}